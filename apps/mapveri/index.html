<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>MapVeri — Community OpenStreetMap</title>
    <meta name="description" content="MapVeri: Progressive Web App for community-verified mapping in Boisar, Palghar & Maharashtra. Works online and offline." />
    <meta name="robots" content="index, follow" />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#172a3a" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="MapVeri" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MapVeri" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Web App Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Social & Open Graph -->
    <meta property="og:title" content="MapVeri — Community OpenStreetMap" />
    <meta property="og:description" content="Community-verified local mapping in Boisar, Palghar & Maharashtra. Progressive Web App." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MapVeri — Community OpenStreetMap" />
    <meta name="twitter:description" content="Community-verified local mapping in Boisar, Palghar & Maharashtra." />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
