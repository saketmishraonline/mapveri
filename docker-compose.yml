# ==============================================================================
# MapVeri Multi-Container Docker Compose Stack
# Run all services: docker compose up --build
# ==============================================================================

services:
  # 1. Local PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mapveri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mapveri_db}
    ports:
      - "5432:5432"
    volumes:
      - mapveri_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mapveri_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: mapveri-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/mapveri_db}
      JWT_SECRET: ${JWT_SECRET:-mapveri-production-secret-key-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}

  # 3. Web Frontend (Nginx serving MapVeri React SPA + API reverse proxy)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    container_name: mapveri-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "5173:80"

volumes:
  mapveri_pgdata:
    driver: local
