kind = "web"
previewPath = "/"
title = "MapVeri"
description = "A community-powered open map where people discover, add, and verify locations together, with an operator dashboard for review and moderation."
version = "1.0.0"
id = "artifacts/mapveri"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24998

[services.development]
run = "pnpm --filter @workspace/mapveri run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mapveri", "run", "build" ]
serve = "static"
publicDir = "artifacts/mapveri/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24998"
BASE_PATH = "/"
