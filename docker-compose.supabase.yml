# ==============================================================================
# MapVeri Docker Compose Stack for Supabase Managed Database
# Use this when your database is hosted on Supabase (no local postgres container needed)
# Run: docker compose -f docker-compose.supabase.yml up --build
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: mapveri-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: 5000
      NODE_ENV: production

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    container_name: mapveri-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "5173:80"
